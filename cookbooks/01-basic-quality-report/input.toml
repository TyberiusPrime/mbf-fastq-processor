[input]
    # Single-end reads for this example
    # For paired-end data, you would also include: read2 = 'input/sample_R2.fq'
    read1 = 'input/sample_R1.fq'

[[step]]
  action = "CalcGCContent"
    relative = true
  out_label = "gc_content"

[[step]]
    # Generate a comprehensive quality report
    action = 'Report'
    name = 'initial'

    # Count total number of reads
    count = true

    # Analyze base quality scores and GC content
    base_statistics = true
    # Analyze the distribution of read lengths

    length_distribution = true

    # Count duplicate reads (identical sequences)
    duplicate_count_per_read = true

    # Count duplicate reads (identical sequences)
    duplicate_count_per_fragment = true

    # count how often these oligos occur.
    # no mismatches, no IUPAC
	count_oligos = {AAAAAA = 'AAAAAA', p5_adapter = 'GATCGGAAGAGCACACGTCTGAACTCCAGTCAC', p7_adapter = 'ATCTCGTATGCCGTCTTCTGCTTG', GGGGGGGGGGG = 'GGGGGGGGGGG'}

    # Histogram of gc content (rounded to nearest integer)
  # optional
    tag_histograms = ["gc_content"]


[output]
    prefix = "reference_output/output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"

[[step]]
    action = "OutputReport"
    json = true
    html = true
