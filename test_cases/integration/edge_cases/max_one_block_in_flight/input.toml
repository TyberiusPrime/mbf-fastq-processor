[input]
    read1 = 'input_read1.fq.zst'
    read2 = 'input_read2.fq.zst'

[options]
  # 1 read budget => only ever one block admitted at a time (overshoot by one block).
  max_reads_in_flight = 1

[[step]]
    action = 'Report'
    name = 'xyz'
    duplicate_count_per_read = true
    length_distribution = true
    base_statistics = true

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputReport"
    json = true
    html = false
