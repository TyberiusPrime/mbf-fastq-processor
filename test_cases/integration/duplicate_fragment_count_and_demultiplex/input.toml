[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractRegion'
    anchor = "Left"
    source = "read1"
    start = 0
    len = 2
    out_label = 'barcode'

[[step]]
    action = 'Report'
    name = 'pre_demultiplex'
    count = true
    duplicate_count_per_fragment = true

[[step]]
    action = 'Demultiplex'
    in_label = 'barcode'
    output_unmatched = true
    barcodes = 'barcodes'

[barcodes.barcodes]
    AA = 'sample1'
    GG = 'sample2'

[[step]]
    action = 'Report'
    name = 'post_demultiplex'
    count = true
    duplicate_count_per_fragment = true

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"

[[step]]
    action = "OutputReport"
    json = true
    html = true
