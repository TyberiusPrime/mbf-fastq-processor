[input]
    read1 = 'input_read1.fq'


[[step]]
    action = 'CalcQualifiedBases'
    relative = false
	out_label = 'qb'
    threshold='B'
	op = 'below_or_equal'

[[step]]
	action = 'EvalExpression'
	out_label = 'qbr'
	expression = 'qb / len_read1'

[[step]]
	action = "FilterByNumericTag"
	in_label = 'qbr'
    min_value = 0.8
	keep_or_remove = 'keep'


[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
