    out_label = 'low_complexity_ratio'

[[step]]
    action = 'FilterByNumericTag'
    in_label = 'low_complexity_ratio'
    max_value = -0.1
    keep_or_remove = 'Keep'


[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
