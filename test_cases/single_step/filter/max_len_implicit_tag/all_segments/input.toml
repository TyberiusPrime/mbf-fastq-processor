[input]
    index1 = 'input_index1.fq'
    read1 = 'input_read1.fq'
    read2 = 'input_read2.fq'
    index2 = 'input_index2.fq'

[options]
    accept_duplicate_files = true

[[step]]
  action = 'StoreTagsInTable'
  in_labels = ['len_all']
  

[[step]]
	action = 'FilterByNumericTag'
	max_value = 157
	keep_or_remove = 'keep'
	in_label = 'len_all'


[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    output = ["read2", "read1"]
