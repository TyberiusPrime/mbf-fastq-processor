[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'CalcExpectedError'
    out_label = 'expected_error'
    aggregate = 'sum'
    segment = 'read1' # since it defaults to 'all'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'expected_error'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
