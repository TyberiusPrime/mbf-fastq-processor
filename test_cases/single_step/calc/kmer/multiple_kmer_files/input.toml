[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"

[[step]]
    action = 'CalcKmers'
    out_label = 'kmer_count'
    segment = 'read1'
    files = ['input_kmers2.fa', 'input_kmers.fa']
    k = 4
  # min_count = 1
    canonical = false

[[step]]
    action = 'CalcKmers'
    out_label = 'kmer_count_kmer_read_len'
    segment = 'read1'
    files = ['input_kmers.fa', 'input_kmers2.fa']
    k = 8
  # min_count = 1
    canonical = false

[[step]]
    action = 'StoreTagInComment'
    in_label = ['kmer_count', 'kmer_count_kmer_read_len']

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
