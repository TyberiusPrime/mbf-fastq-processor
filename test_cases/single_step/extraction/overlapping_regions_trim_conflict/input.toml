[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'Head'
    n = 4

# Extract first region (positions 2-5) - this will be "tag1"
[[step]]
    action = 'ExtractRegions'
    out_label = 'tag1'
    regions = [{ start = 2, length = 4, anchor = "Start"}]
    segment = 'read1'

# Extract second region (positions 4-7) - overlaps with tag1 at positions 4-5
[[step]]
    action = 'ExtractRegions' 
    out_label = 'tag2'
    regions = [{ start = 4, length = 4, anchor = "Start"}]
    segment = 'read1'

# Store both tags in table before trimming
[[step]]
    action = 'StoreTagsInTable'
    infix = 'tags_before_trim'

# Trim at tag1 start, which should invalidate tag2's original positions
[[step]]
    action = 'TrimAtTag'
    in_label = 'tag1'
    direction = 'Start'
    keep_tag = false

# Store tags in table after trimming - they're still there because we have captured their sequenc
[[step]]
    action = 'StoreTagsInTable'
    infix = 'tags_after_trim'


[[step]]
	action = "Lowercase"
	source = "tag:tag2"

[[step]]
	action = "StoreTagBackInSequence"
    on_lost = 'complain'
	in_label = "tag2"

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
