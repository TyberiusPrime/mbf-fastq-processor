[input]
    read1 = 'input_read1.fq'

[output]
    prefix = 'output'
    output = []  # no read1 output

[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    out_label = 'barcode'
    segment = 'read1'
    start = 0
    length = 2

[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    out_label = 'sequence'
    segment = 'read1'
    start = 2
    length = 4

[[step]]
    action = 'Demultiplex'
    in_label = 'barcode'
    output_unmatched = false
    barcodes = 'samples'

[barcodes.samples]
    AA = 'sample-a'
    CC = 'sample-b'
    GG = 'sample-c'

[[step]]
    action = 'StoreTagInFastQ'
    in_label = 'sequence'
    commentLabels = 'location_sequence'
