[input]
    read1 = 'input_read1.fq'


[options]
  block_size = 1

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'barcode'
    anchor = 'Left'
    search = 'ATCG'
    max_mismatches = 0


[[step]]
    action = "_InternalDelay"

[[step]]
    action = 'StoreTagInFastQ'
    in_label = 'barcode'
    comment_tags = ["location_barcode"]

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    output = []
