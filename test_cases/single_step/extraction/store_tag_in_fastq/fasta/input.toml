[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'barcode'
    anchor = 'Left'
    search = 'ATCG'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'barcode2'
    anchor = 'Left'
    search = 'ATCG'
    max_mismatches = 0

[[step]]
    action = 'StoreTagsInFastQ'
    in_label = 'barcode'
    comment_tags = ['location_barcode', 'location_barcode2']
    format = "fasta"



[[step]]
  action = "ForgetTag"
  in_label = "barcode2"

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    output = []
