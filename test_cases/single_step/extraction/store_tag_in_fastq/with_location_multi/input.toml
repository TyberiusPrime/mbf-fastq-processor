[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractRegions'
    out_label = 'barcode'
    regions = [
  { anchor = 'Left', start = 0, len=4},
  { anchor = 'Left', start = 6, len=2},
]
    source = 'read1'

[[step]]
    action = 'StoreTagInFastQ'
    in_label = 'barcode'
  comment-tags = 'location_barcode'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    output = []
