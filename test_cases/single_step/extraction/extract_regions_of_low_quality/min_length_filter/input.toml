[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractRegionsOfLowQuality'
    out_label = 'low_quality'
    min_quality = 40
    min_length = 27

[[step]]
  action = 'lowercase'
  target = 'tag:low_quality'

[[step]]
  action = 'StoreTagBackInSequence'
  in_label = "low_quality"

[[step]]
    action = 'StoreTagInComment'
    in_label = 'location_low_quality'

[output]
    prefix = 'output'