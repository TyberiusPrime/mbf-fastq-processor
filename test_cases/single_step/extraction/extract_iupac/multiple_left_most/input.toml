[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractIUPAC'
    search = ["TCAAC", "GGCGA", "TTCAA"]
    out_label = 'iupac_match'
    anchor = 'Anywhere'
    max_mismatches = 0
    on_tie = 'left_most'

[[step]]
	action = 'Lowercase'
	source = 'tag:iupac_match'

[[step]]
	action = 'StoreTagBackInSequence'
	in_label = 'iupac_match'

[[step]]
    action = 'FilterByTag'
    in_label = 'iupac_match'
    keep_or_remove = 'Keep'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'iupac_match'

[output]
    prefix = 'output'
