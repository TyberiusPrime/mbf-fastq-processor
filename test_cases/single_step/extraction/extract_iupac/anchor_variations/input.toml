[input]
    read1 = 'input_read1.fq'

# Left anchor: pattern TTGG must start within max_anchor_distance of position 0
[[step]]
    action = 'ExtractIUPAC'
    out_label = 'L0'
    anchor = 'Left'
    max_anchor_distance = 0
    search = 'TTGG'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'L1'
    anchor = 'Left'
    max_anchor_distance = 1
    search = 'TTGG'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'L2'
    anchor = 'Left'
    max_anchor_distance = 2
    search = 'TTGG'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'L3'
    anchor = 'Left'
    max_anchor_distance = 3
    search = 'TTGG'
    max_mismatches = 0

# Right anchor: pattern TTGG must end within max_anchor_distance of the read end
[[step]]
    action = 'ExtractIUPAC'
    out_label = 'R0'
    anchor = 'Right'
    max_anchor_distance = 0
    search = 'TTGG'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'R1'
    anchor = 'Right'
    max_anchor_distance = 1
    search = 'TTGG'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'R2'
    anchor = 'Right'
    max_anchor_distance = 2
    search = 'TTGG'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'R3'
    anchor = 'Right'
    max_anchor_distance = 3
    search = 'TTGG'
    max_mismatches = 0

# Anywhere anchor with all three on_tie modes (two patterns to force ties)
[[step]]
    action = 'ExtractIUPAC'
    out_label = 'AE'
    anchor = 'Anywhere'
    search = ['TTGG', 'CCAA']
    max_mismatches = 0
    on_tie = 'Earliest'

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'ALM'
    anchor = 'Anywhere'
    search = ['TTGG', 'CCAA']
    max_mismatches = 0
    on_tie = 'LeftMost'

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'ARM'
    anchor = 'Anywhere'
    search = ['TTGG', 'CCAA']
    max_mismatches = 0
    on_tie = 'RightMost'

# Multi-hit within window: Left prefers leftmost, Right prefers rightmost.
# RY (purine+pyrimidine) is 2 bp so two non-overlapping hits fit in the d=3 window.
# The extracted value is the actual matched bases, so the chosen position is visible.
[[step]]
    action = 'ExtractIUPAC'
    out_label = 'L3_ry'
    anchor = 'Left'
    max_anchor_distance = 3
    search = 'RY'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'R3_ry'
    anchor = 'Right'
    max_anchor_distance = 3
    search = 'RY'
    max_mismatches = 0

[[step]]
    action = 'StoreTagInComment'
    in_label = 'L0'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'L1'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'L2'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'L3'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'R0'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'R1'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'R2'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'R3'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'AE'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'ALM'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'ARM'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'L3_ry'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'R3_ry'

[output]
    prefix = 'output'
