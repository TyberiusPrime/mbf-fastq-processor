[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractRegex'
    source = 'read1'
    out_label = 'test'
    search = 'N{2,}'
    replacement = '$0$0'

[[step]]
    action = 'StoreTagBackInSequence'
    in_label = 'test'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
