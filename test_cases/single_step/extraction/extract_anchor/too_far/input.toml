[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractIUPAC'
    search = "CAYA"
    out_label = 'anchor_tag'
    anchor = 'Anywhere'
    max_mismatches = 0

[[step]]
    action = 'ExtractRegions'
	regions = [
	{ 'start'= -2, 'length'= 4, 'anchor'= 'Start'},
	{ 'start'= 4, 'length'= 100, 'anchor'= 'Start'},	]
    out_label = 'test'
    'source'= 'tag:anchor_tag'
[[step]]
    action = 'FilterByTag'
    in_label = 'test'
    keep_or_remove = 'Keep'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'location_test'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'test'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
