[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'Head'
    n = 4

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'barcode1'
    search = 'CTC'
    anchor = 'Left'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'barcode2'
    search = 'CAA'
    anchor = 'Anywhere'
    max_mismatches = 0

[[step]]
    action = 'StoreTagInTable'
    infix = 'tags'
    include_read_comment = true
#format = 'TSV'

[output]
    prefix = "output"
