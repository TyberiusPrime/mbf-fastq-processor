[input]
read1 = "input_read1.fq"

[[step]]
action = "Head"
n = 4

[[step]]
action = "ExtractIUPAC"
out_label = "barcode1"
search = "CTC"
anchor = "Left"
max_mismatches = 0

[[step]]
action = "ExtractIUPAC"
out_label = "barcode2"
search = "CAA"
anchor = "Anywhere"
max_mismatches = 0

[[step]]
action = "StoreTagsInTable"
infix = "tags"
tags = [
  "barcode3",
  "barcode4",
  "len_barcode3",
  "len_barcode4",
  "read_nox",
  "location_barcode3",
  "location_barcode4",
  "initial_location_barcode4",
  "barcode1",
]
# format = 'TSV'

[output]
prefix = "output"
