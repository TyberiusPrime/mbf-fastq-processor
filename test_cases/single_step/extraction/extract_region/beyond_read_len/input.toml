[input]
    read1 = 'input_read1.fq.gz'


[[step]]
    action = 'Head'
    n = 2

[[step]]
    action = 'ExtractRegions'
    out_label = 'UMI'
    regions = [{ start = 200, length = 6, anchor="Start"},
               { start = 250, length = 6, anchor="Start"}]
    segment = 'read1'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'UMI'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
