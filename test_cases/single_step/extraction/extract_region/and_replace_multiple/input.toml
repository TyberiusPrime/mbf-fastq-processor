[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'Head'
    n = 4

[[step]]
    action = 'ExtractRegions'
    out_label='umi'
    regions = [
        { start = 0, length = 2, anchor="Start"},
        { start = 10, length = 3, anchor="Start"},
    ]
    segment = 'read1'

[[step]]
    action = 'Lowercase'
    source = 'tag:umi'

[[step]]
    action = 'StoreTagBackInSequence'
    in_label = 'umi'

[[step]]
    action = 'StoreTagInComment'
    #region_separator = '-' # ignored, lowercase has turned it into a contigous block 
    in_label = 'umi'

[output]
    prefix = 'output'
