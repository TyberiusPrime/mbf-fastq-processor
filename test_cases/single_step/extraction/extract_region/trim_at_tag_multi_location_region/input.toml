[input]
    read1 = 'input_read1.fq'

[options]
    accept_duplicate_files = true


[[step]]
    action = 'Head'
    n = 2

[[step]]
    action = 'ExtractRegions'
    out_label = 'UMI'
    segment = 'read1'
    regions = [{ start = 0, length = 6, anchor="Start"},
			   {start = 6, length = 6, anchor="Start"}]

[[step]]
    action = 'TrimAtTag'
    in_label = 'UMI'
    direction = 'Start'
    keep_tag = false

[output]
    prefix = 'output'
