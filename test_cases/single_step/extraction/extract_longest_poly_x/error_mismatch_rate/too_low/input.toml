[input]
read1 = "input_read1.fq"

[output]
    prefix = "output"
[[step]]
action = "ExtractLongestPolyX"
base = "A"
max_consecutive_mismatches = 1
max_mismatch_rate = -1134
min_length = 3
out_label = "poly_a"
segment = "read1"

[[step]]
action = "StoreTagInComment"
in_label = "location_poly_a"
segment = "read1"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
