[input]
    read1 = 'input_read1.fq'

# Extract the first 3 bases as the replacement value
[[step]]
    action = 'ExtractRegion'
    segment = 'read1'
    start = 0
    length = 3
    out_label = 'val_tag'
    anchor = 'Start'

# Extract bases 3-6 as the region to replace
[[step]]
    action = 'ExtractRegion'
    segment = 'read1'
    start = 3
    length = 3
    out_label = 'pos_tag'
    anchor = 'Start'

# Replace pos_tag's region (3-6) with val_tag's sequence (same length: 3)
[[step]]
    action = 'StoreTagInSequence'
    in_value_label = 'val_tag'
    in_position_label = 'pos_tag'
    anchor = 'Replace'

[output]
    prefix = 'output'
