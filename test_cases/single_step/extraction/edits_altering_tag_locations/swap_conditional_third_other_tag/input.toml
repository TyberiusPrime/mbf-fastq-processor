[input]
    read1 = ['input_read1.fq.zst']
    read2 = ['input_read2.fq.zst']
    read3 = ['input_read2.fq.zst']

[options]
  accept_duplicate_files = true

[[step]]
    action='Head'
    n = 5

[[step]]
	action = 'ExtractIUPAC'
	out_label = 'tagr1'
	search = 'TCA'
	anchor = 'Anywhere'
	segment = 'read2'
	max_mismatches = 0

[[step]]
	action = 'ExtractIUPAC'
	out_label = 'tagr2'
	search = 'GCC'
	anchor = 'Anywhere'
	segment = 'read1'
	max_mismatches = 0

[[step]]
	action = 'ExtractIUPAC'
	out_label = 'tagr3'
	search = 'GCC'
	anchor = 'Anywhere'
	segment = 'read3'
	max_mismatches = 0

[[step]]
  action = "EvalExpression"
  expression = "read_no % 2 == 0"
  out_label = "is_read_even"

[[step]]
	action ='Lowercase'
	source = 'tag:tagr2'

[[step]]
    action = 'Swap'
	segment_a = 'read1'
	segment_b = 'read2'
    if_tag = "is_read_even"

[[step]]
	action = 'StoreTagInComment'
	in_label = 'location_tagr1'
	segment = 'All'

[[step]]
	action = 'StoreTagInComment'
	in_label = 'location_tagr2'
	segment = 'All'

[[step]]
	action = 'StoreTagInComment'
	segment = 'All'
	in_label = 'tagr1'

[[step]]
	action = 'StoreTagInComment'
	segment = 'All'
	in_label = 'tagr2'

[[step]]
	action ='Lowercase'
	source = 'tag:tagr1'


[[step]]
	action = 'StoreTagBackInSequence'
	in_label = 'tagr1'

[[step]]
	action = 'StoreTagBackInSequence'
	in_label = 'tagr2'

[[step]]
	action ='Lowercase'
	source = 'tag:tagr3'

[[step]]
	action = 'StoreTagBackInSequence'
	in_label = 'tagr3'


[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
