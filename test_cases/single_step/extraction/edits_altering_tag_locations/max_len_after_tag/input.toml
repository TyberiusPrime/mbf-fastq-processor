[input]
	read1 = 'input_read1.fq'
[[step]]
	action = 'Head'
	n = 2
[[step]]
	action = 'ExtractIUPAC'
	out_label = 'tag'
	search = 'TCA'
	anchor = 'Anywhere'
	max_mismatches = 0
[[step]]
   action ='Truncate'
   n = 45
[[step]]
	action='StoreTagInComment'
	in_label = 'location_tag'

[[step]]
	action='Lowercase'
	source = 'tag:tag'

[[step]]
	action = 'StoreTagBackInSequence'
	in_label ='tag'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
