[input]
    read1 = 'input_read1.fq'
    read2 = 'input_read2.fq'

[[step]]
    action = 'ExtractIUPAC'
    anchor = 'Anywhere'
    out_label = 'test'
    segment = 'read2'
    search = 'TCAA'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    anchor = 'Anywhere'
    out_label = 'check1'
    segment = 'read1'
    search = 'TCA'
    max_mismatches = 0

[[step]]
    action = 'ExtractIUPAC'
    anchor = 'Anywhere'
    out_label = 'check2'
    segment = 'read2'
    search = 'GGA'
    max_mismatches = 0


[[step]]
    action = 'TrimAtTag'
    in_label = 'test'
    direction = 'Start'
    keep_tag = false

[[step]]
	action = 'StoreTagInComment'
	in_label = 'check1'
	segment = 'All'

[[step]]
	action = 'StoreTagInComment'
	in_label = 'location_check1'
	segment = 'All'

[[step]]
	action = 'StoreTagInComment'
	in_label = 'check2'
	segment = 'All'

[[step]]
	action = 'StoreTagInComment'
	in_label = 'location_check2'
	segment = 'All'

[[step]]
	action = 'StoreTagInComment'
	in_label = 'location_test'
	segment = 'All'


[[step]]
	action = 'StoreTagInComment'
	in_label = 'test'
	segment = 'All'


[[step]]
	action = 'Lowercase'
	source = 'tag:check1'

[[step]]
	action = 'Lowercase'
	source = 'tag:check2'

[[step]]
	action = 'StoreTagBackInSequence'
	in_label = 'check1'
	on_lost='ignore'

[[step]]
	action = 'StoreTagBackInSequence'
	in_label = 'check2'
	on_lost='ignore'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
