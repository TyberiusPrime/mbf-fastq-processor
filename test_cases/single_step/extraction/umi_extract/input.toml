[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'Head'
    n = 2

[[step]]
    action = 'ExtractRegions'
    out_label='umi'
    regions = [{ start = 1, length = 5, anchor="Start"}]
    segment = 'read1'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'umi'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
