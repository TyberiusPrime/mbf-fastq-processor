[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'Head'
    n = 2

[[step]]
    action = 'CalcGCContent'
    relative = true
    out_label = 'total_gc'
[[step]]
    action = 'CalcGCContent'
    relative = true
    out_label = 'read1_gc'
[[step]]
	action = "StoreTagInComment"
	in_label = "total_gc"

[[step]]
	action = "StoreTagInComment"
	in_label = "read1_gc"

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    output = ["read1"]
