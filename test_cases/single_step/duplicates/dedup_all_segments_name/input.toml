[input]
    read1 = 'input_read1.fq'
    read2 = 'input_read2.fq'


[[step]]
    action = 'TagDuplicates'
    false_positive_rate = 0.001
    source = 'name:all'
    seed = 34
	out_label = 'is_duplicate'

[[step]]
	action = 'FilterByTag'
	in_label = 'is_duplicate'
	keep_or_remove = 'remove'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
