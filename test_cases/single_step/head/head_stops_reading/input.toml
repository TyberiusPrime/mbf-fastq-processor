[input]
    read1 = 'input_read1.fq' # ! instead of @ after 250 reads.

[options]
    buffer_size = 100
    block_size = 5
    max_reads_in_flight = 50

[[step]]
action = 'Head'
n = 128

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
