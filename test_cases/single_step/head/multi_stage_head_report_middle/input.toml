[input]
    read1 = 'input_read1.fq.zst'
[options]
    block_size = 15 # number of reads per block. We keep it low, and should see much fewer than the 10k
                    # in teh input file,
                    # depending on the actual schedulding
    # Cap reads in flight well under the top _InternalReadCount bound (1000) so
    # Head's early termination is observed deterministically, not racing the
    # pre-fetch (which can otherwise admit up to max_reads_in_flight reads).
    max_reads_in_flight = 500


[[step]]
    action = '_InternalReadCount'
    out_label = 'top'

[[step]]
    action ='Head'
    n = 10

[[step]]
    action = 'Report'
    name = 'report_middle'
    count = true


[[step]]
    action = '_InternalReadCount'
    out_label = 'middle'

[[step]]
    action ='Head'
    n = 1

[[step]]
    action = '_InternalReadCount'
    out_label = 'bottom'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"

[[step]]
    action = "OutputReport"
    json = true
    html = false
