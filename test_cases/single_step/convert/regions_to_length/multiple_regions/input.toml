[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractRegions'
    out_label = 'mytag'
    regions = [
        { start = 0, length = 2, anchor="start" },
        { start = 4, length = 4, anchor="start" },
    ]
    segment = 'read1'

[[step]]
    action = 'ConvertRegionsToLength'
    out_label = 'region_len'
    in_label = 'mytag'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'region_len'
    segment = 'read1'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
