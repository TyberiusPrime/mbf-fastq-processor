[input]
    read1 = 'input_read1.fq'

[output]
    prefix = 'output'
    format = 'fastq'
    compression = 'raw'

[[step]]
    action = 'ExtractRegion'
    source = "read1"
    anchor = "start"
    start = 0
    length = 50
    out_label = 'query_seq'

[[step]]
    action = 'AssignByHalves'
    in_label = 'query_seq'
    out_label = 'probe_name'
    barcodes = 'probes'
    name_split_character = '_'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'probe_name'

# Two probes share the prefix "probe1"; their left halves differ by 1 base
# (probe1_a all-A vs probe1_b leading-T) so a query like GAAA... ties at d=1
# against both. Without name-collapse, the resonator returns 2 hits and the
# left-rescue path bails out. With name_split_character='_', the names compare
# equal as "probe1", combine_name_identical_tied_matches collapses to a single
# hit and the right half (matching only probe1_a's right) drives the rescue.
[barcodes.probes]
    AAAAAAAAAAAAAAAAAAAAAAAAATTTTTTTTTTTTTTTTTTTTTTTTT = 'probe1_a'
    TAAAAAAAAAAAAAAAAAAAAAAAAGGGGGGGGGGGGGGGGGGGGGGGGG = 'probe1_b'
