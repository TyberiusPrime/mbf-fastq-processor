[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'Report'
    name = 'charlie_report'
    count = true
    base_statistics = true

# First report - should appear first  
[[step]]
    action = 'Report'
    name = 'alpha_report'
    count = true
    length_distribution = true

# Second report - should appear second
[[step]]
    action = 'Report'
    name = 'beta_report'
    count = true
    duplicate_count_per_read = true

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputReport"
    json = true
    html = true
