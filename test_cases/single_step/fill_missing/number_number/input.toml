[input]
    read1 = 'input_read1.fq'

# Primary numeric tag: A-base content
[[step]]
    action = 'CalcBaseContent'
    segment = 'read1'
    bases_to_count = 'A'
    relative = true
    out_label = 'a_content'

# Secondary numeric tag: read length (used as fallback)
[[step]]
    action = 'CalcLength'
    segment = 'read1'
    out_label = 'read_len'

# FillMissing with numeric+numeric: both always present, primary always wins
[[step]]
    action = 'FillMissing'
    in_label_primary = 'a_content'
    in_label_secondary = 'read_len'
    out_label = 'result'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'result'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
