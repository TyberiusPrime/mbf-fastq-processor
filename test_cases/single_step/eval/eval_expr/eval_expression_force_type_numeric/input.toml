[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'CalcNContent'
    relative = false
    segment = 'read1'
    out_label = 'n_count'

[[step]]
    action = 'EvalExpression'
    out_label = 'n_even'
    expression = 'n_count % 2 == 0'
    result_type = 'numeric'

[[step]]
  action = 'FilterByNumericTag'
  in_label = 'n_even'
  min_value = 1.0
  keep_or_remove = 'keep'


[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputTSV"
