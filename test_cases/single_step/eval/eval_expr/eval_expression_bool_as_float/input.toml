[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'CalcNContent'
    relative = false
    segment = 'read1'
    out_label = 'n_count'

[[step]]
    action = 'EvalExpression'
    out_label = 'n_even'
    expression = 'n_count % 2 == 0'


[[step]]
    action = 'EvalExpression'
    out_label = 'mult'
    expression = 'n_even * 3'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'mult'
    segment = 'read1'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
