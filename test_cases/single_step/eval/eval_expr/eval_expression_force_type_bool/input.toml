[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'CalcNContent'
    relative = false
    segment = 'read1'
    out_label = 'n_count'

[[step]]
    action = 'EvalExpression'
    out_label = 'n_even'
    expression = '(n_count -1) / 2'
    result_type = 'bool'


[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputTSV"
