[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'CalcNContent'
    relative = false
    segment = 'read1'
    out_label = 'n_count'

[[step]]
    action = 'CalcLength'
    segment = 'read1'
    out_label = 'length'

[[step]]
    action = 'EvalExpression'
    out_label = 'n_rate'
    expression = 'n_count / length'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'n_rate'
    segment = 'read1'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
