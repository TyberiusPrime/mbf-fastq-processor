[input]
    read1 = 'input_read1.fq'



[[step]]
    action = 'CalcNContent'
    relative = false
	out_label = 'nn'

[[step]]
	action = 'EvalExpression'
	out_label = 'n_ok'
	expression = '''
		nn < 26	
	'''

[[step]]
	action ='FilterByTag'
	in_label = 'n_ok'
	keep_or_remove = 'keep'


[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
