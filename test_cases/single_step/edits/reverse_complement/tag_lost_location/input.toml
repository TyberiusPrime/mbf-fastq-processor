[input]
	read1 = 'input_read1.fq'

[[step]]
	action = 'ExtractIUPAC'
	out_label = 'tag'
	search = 'TCA'
	anchor = 'Anywhere'
	max_mismatches = 0


[[step]]
  action = 'CutStart'
  n = 10

[[step]]
    action ='ReverseComplement'
    source = 'tag:tag'

[[step]]
	action='Lowercase'
	source = 'tag:tag'

[[step]]
	action = 'StoreTagsInTable'
    in_labels = ['tag','location_tag', 'initial_location_tag']

[[step]]
  action = 'StoreTagBackInSequence'
  in_label='tag'

[output]
	prefix = 'output'
