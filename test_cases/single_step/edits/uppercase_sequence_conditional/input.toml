[input]
    read1 = 'input_read1.fq'

[[step]]
  action = 'EvalExpression'
  out_label = 'even'
  expr = 'read_no % 2 == 0'
  

[[step]]
    action = 'Uppercase'
    target = 'all'
    if_tag = 'even'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
