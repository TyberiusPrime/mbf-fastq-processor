[input]
    read1 = 'input_read1.fq'
    read2 = 'input_read2.fq'

[[step]]
    action = 'MergeReads'
    algorithm = 'Fastp'
    min_overlap = 5
    max_mismatch_count = 0
    max_mismatch_rate = 0.0
    no_overlap_strategy = 'as_is'
    reverse_complement_segment2 = false
    segment1 = 'read1'
    segment2 = 'read2'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
