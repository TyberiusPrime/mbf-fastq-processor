[input]
    read1 = 'input_read1.fq'

[[step]]
  action = 'EvalExpression'
  out_label = 'even'
  expr = 'read_no % 2 == 0'

[[step]]
    action = 'ExtractIUPAC'
    out_label = 'test'
    anchor = 'Left'
    search = 'CTN'
    max_mismatches = 0

[[step]]
    action = 'Uppercase'
    target = 'tag:test'
    if_tag = 'even'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'test'

[[step]]
  action = 'StoreTagBackInSequence'
  in_label = 'test'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
