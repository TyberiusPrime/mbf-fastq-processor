[input]
    read1 = 'sample_data/ten_reads.fq'

[[step]]
    action = 'CalcBaseContent'
    out_label = 'bc1'
    bases_to_count = 'G'
    bases_to_ignore = 'N'
    relative = true

[barcodes.bc1]  
  AGT = 'AGTC'

[output]
    prefix = 'output'


[[step]]
  action = 'extractregion'
  source = 'read1'
  start = 0
  len = 4
  anchor ='left'
  out_label = 'lbc1'

[[step]]
  action = 'Demultiplex'
  in_label = 'lbc1'
  barcodes = 'bc1'
  output_unmatched = true
