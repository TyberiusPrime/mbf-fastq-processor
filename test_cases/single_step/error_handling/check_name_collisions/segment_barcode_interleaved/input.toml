[input]
    segs = 'sample_data/ten_reads.fq'
    interleaved = ['read1','read2']

[barcodes.read1]
  AGT = "ATC"


[[step]]
  action = 'extractregion'  
  segment = 'read1'
  start =0
  len = 3
  anchor = 'left'
  out_label = 'bc1'

[output]
    prefix = "output"
[[step]]
  action = 'demultiplex'
  barcodes = 'read1'
  in_label = 'bc1'
  output_unmatched=false

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
