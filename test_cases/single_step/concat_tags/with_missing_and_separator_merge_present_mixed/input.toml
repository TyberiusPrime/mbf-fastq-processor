[input]
    read1 = 'input_read1.fq'

# Extract first barcode - present in all reads
# [[step]]
#     action = 'ExtractIUPAC'
#     search = "AAAA"
#     out_label = 'barcode1'
#     anchor = 'Left'
#     max_mismatches = 0

# Extract second barcode - only present in some reads
[[step]]
    action = 'ExtractRegex'
    source = 'read1'
    search = "^AAAA"
    out_label = 'barcode2'

# Extract second barcode - only present in some reads
[[step]]
    action = 'ExtractRegex'
    source = 'name:read1'
    search = "^read[12]"
    out_label = 'barcode3'

# Concatenate - should set to missing if any tag is missing
[[step]]
    action = 'ConcatTags'
    in_labels = ['barcode3', 'barcode2']
    out_label = 'combined'
    on_missing = 'merge_present'
    separator = '!'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'combined'

[[step]]
  action ="StoreTagsInTable"
[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
