[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractIUPAC'
    search = "AAAA"
    out_label = 'tag1'
    anchor = 'Left'
    max_mismatches = 0

[[step]]
    action = 'ConcatTags'
    in_labels = ['tag1', 'tag1', 'tag1']
    out_label = 'combined'
    on_missing = 'merge_present'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'combined'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
