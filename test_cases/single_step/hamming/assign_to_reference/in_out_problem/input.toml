# Each reference sequence is queried against the database.
# With max_hamming_distance = 2 and sequences separated by >=37 bases,
# each query must produce exactly one hit (itself).
[input]
    read1 = 'input_read1.fq'

[output]
    prefix = 'output'
    format = 'fastq'
    compression = 'raw'

[[step]]
    action = 'ExtractRegion'
    source = "read1"
    anchor = "start"
    start = 0
    length = 50
    out_label = 'query_seq'

[[step]]
    action = 'AssignToReference'
    in_label = 'query_seq'
    out_label = 'query_seq'
    max_hamming_distance = 0
  barcodes ='bc'

[barcodes.bc]
  AGT = 'on'
  ATT = 'two'
[[step]]
    action = 'StoreTagInComment'
    in_label = 'query_seq'
