# Each reference sequence is queried against the database.
# With max_hamming_distance = 2 and sequences separated by >=37 bases,
# each query must produce exactly one hit (itself).
[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    source = "read1"
    anchor = "start"
    start = 0
    length = 50
    out_label = 'query_seq'

[[step]]
    action = 'HammingCorrect'
    output = 'label'
    on_tie = 'fail'
    on_no_match = 'remove'
    in_label = 'query_seq'
    out_label = 'ref_name'
    max_hamming_distance = 2
barcodes = 'b'

[barcodes.b]
    from_file.filename = 'input_reference.fa'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'ref_name'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "raw"
