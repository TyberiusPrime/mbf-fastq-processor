[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    source = "read1"
    anchor = "start"
    start = 0
    length = 50
    out_label = 'query_seq'

[[step]]
    action = 'HammingCorrect'
    output = 'label'
    on_tie = 'fail'
    on_no_match = 'remove'
    in_label = 'query_seq'
    out_label = 'ref_name'
    max_hamming_distance = 2
  barcodes = 'ref'

[barcodes.ref]
  from_file.filename = 'input_reference.fa'

# Keep only reads that got a reference assignment
[[step]]
    action = 'FilterByTag'
    in_label = 'ref_name'
    keep_or_remove = 'keep'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'ref_name'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "raw"
