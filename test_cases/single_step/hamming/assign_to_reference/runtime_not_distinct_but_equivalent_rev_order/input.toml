[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    source = "read1"
    anchor = "start"
    start = 0
    length = 50
    out_label = 'query_seq'

[[step]]
    action = 'HammingCorrect'
    output = 'label'
    on_tie = 'first_strict'
    on_no_match = 'remove'
    in_label = 'query_seq'
    out_label = 'ref_name'
    max_hamming_distance = 1
    barcodes = 'reference'
    name_split_char = '|'

[barcodes.reference]
   from_file.filename = 'input_reference.fa'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'ref_name'
    comment_separator='!' 

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "raw"
