[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    source = "read1"
    anchor = "start"
    start = 0
    length = 16
    out_label = 'bc_raw'

[[step]]
    action = 'HammingCorrect'
    in_label = 'bc_raw'
    out_label = 'corrected'
    barcodes = 'barcodes'
    output = 'label'
    max_hamming_distance = 2
    on_no_match = 'remove'
    on_tie = 'by_edit_probability'
    by_majority_min_molecules_to_start = 0
    by_majority_threshold = 0.95

[[step]]
    action = 'StoreTagInComment'
    in_label = 'corrected'

[barcodes.barcodes]
    AAAAAAAAAAAAAAAA = 'alpha'
    AAAACAAAAAAGAAAA = 'beta'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "raw"
