[input]
    read1 = 'input_read1.fq.gz'

[output]
    prefix = "output"
[[step]]
    action = 'Head'
    n = 10

[[step]]
    action = 'ExtractRegion'
    source = "read1"
	anchor = "start"
    start = 0
    length = 4
    out_label = 'barcode_extracted'

[[step]]
	action = "StoreTagInComment"
	in_label = "barcode_extracted"

# This should work as basic functionality test
[[step]]
    action = 'HammingCorrect'
	in_label = 'barcode_extracted'
	out_label = 'corrected'
	barcodes = 'barcodes'
	on_no_match = 'remove'
    on_tie = 'fail'
	max_hamming_distance=1

[[step]]
	action = "StoreTagInComment"
	in_label = "corrected"

[[step]]
	action = 'FilterByTag'
	in_label = 'corrected'
	keep_or_remove = 'keep'


[barcodes.barcodez]
    ATGA = 'label1'
    CTCC = 'label2'


[[step]]
  action = 'extractregion'
  source = 'read1'
  start = 0
  len = 4
  anchor ='left'
  out_label = 'lbc1'

[[step]]
  action = 'Demultiplex'
  in_label = 'corrected'
  barcodes = 'barcodez'
  output_unmatched = true

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "raw"
