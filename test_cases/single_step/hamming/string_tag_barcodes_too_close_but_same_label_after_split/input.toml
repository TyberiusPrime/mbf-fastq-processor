[input]
    read1 = 'input_read1.fq.gz'

[output]
    prefix = "output"
[[step]]
    action = 'Head'
    n = 10

[[step]]
    action = 'ExtractRegex'
	source = "name:read1"
	search = "^X(...)"
	replacement="$1"
	out_label = 'barcode_extracted'

[[step]]
	action = "StoreTagInComment"
	in_label = "barcode_extracted"

# This should work as basic functionality test
[[step]]
    action = 'HammingCorrect'
	in_label = 'barcode_extracted'
	out_label = 'corrected'
	barcodes = 'barcodes'
	on_no_match = 'remove'
    on_tie = 'FirstStrict'
	max_hamming_distance=1
    name_split_char = ' '

[[step]]
	action = "StoreTagInComment"
	in_label = "corrected"

[[step]]
	action = 'FilterByTag'
	in_label = 'corrected'
	keep_or_remove = 'keep'


[barcodes.barcodes]
    CGA = 'label2 a'
    AGT = 'label2 b'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "raw"
