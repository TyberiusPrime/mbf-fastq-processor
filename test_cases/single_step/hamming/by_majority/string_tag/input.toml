[input]
    read1 = 'input_read1.fq.gz'

[output]
    prefix = 'output'
    format = 'fastq'
	compression = 'raw'

[[step]]
    action = 'ExtractRegex'
	source = "name:read1"
	search = "^X(...)"
	replacement="$1"
	out_label = 'barcode_extracted'

[[step]]
	action = "StoreTagInComment"
	in_label = "barcode_extracted"

# This should work as basic functionality test
[[step]]
    action = 'HammingCorrect'
	in_label = 'barcode_extracted'
	out_label = 'corrected'
	barcodes = 'barcodes'
	on_no_match = 'remove'
    on_tie = 'ByMajority'
	max_hamming_distance=1
    by_majority_threshold = 0.5

[[step]]
	action = "StoreTagsInTable"


[barcodes.barcodes]
    CGA = 'label2'
    CGC = 'label2'
    AGT = 'label2'
