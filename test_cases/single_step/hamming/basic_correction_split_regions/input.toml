[input]
    read1 = 'input_read1.fq.gz'

[output]
    prefix = "output"
[[step]]
    action = 'Head'
    n = 10

[[step]]
    action = 'ExtractRegions'
    regions = [
  {
      anchor = "start",
      start = 0,
      length = 2,
  },
  {
      anchor = "start",
      start = 2,
      length = 2,
  },
]
    source = "read1"
    out_label = 'barcode_extracted'

[[step]]
	action = "StoreTagInComment"
	in_label = "barcode_extracted"

# This should work as basic functionality test
[[step]]
    action = 'HammingCorrect'
	in_label = 'barcode_extracted'
	out_label = 'corrected'
	barcodes = 'barcodes'
	on_no_match = 'remove'
    on_tie = 'fail'
	max_hamming_distance=1

[[step]]
	action = "StoreTagInComment"
	in_label = "corrected"

[[step]]
	action = 'FilterByTag'
	in_label = 'corrected'
	keep_or_remove = 'keep'


[barcodes.barcodes]
    ATGA = 'label1'
    CTCC = 'label2'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "raw"
