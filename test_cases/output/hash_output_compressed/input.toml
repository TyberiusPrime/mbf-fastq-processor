[input]
    read1 = 'input_read1.fq'
    read2 = 'input_read2.fq'
    index1 = 'input_i1.fq'
    index2 = 'input_i2.fq'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    output = ["read1", "read2", "index1", "index2"]
    compression = "Gzip"
    output_hash_uncompressed = false
    output_hash_compressed = true
