[input]
    read1 = 'input_read1.fq'
    read2 = 'input_read2.fq'

[[step]]
    action='Head' 
    n = 5

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "zst"
    compression_threads = 1
    output_hash_uncompressed = true
    output_hash_compressed = true
