[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    source = 'read1'
    anchor = 'start'
    start = 0
    length = 6
    out_label = 'barcode'


[[step]]
    action = 'ExtractRegex'
    source = 'read1'
    query = "A..C"
    out_label = 'reg'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputBAM"
    tags = { barcode = "BC", reg = "CO" }
