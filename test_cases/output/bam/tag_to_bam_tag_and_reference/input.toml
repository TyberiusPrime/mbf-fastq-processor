[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    source = 'read1'
    anchor = 'start'
    start = 0
    length = 6
    out_label = 'barcode'

[[step]]
    action = 'ExtractRegion'
    source = 'read1'
    anchor = 'start'
    start = 0
    length = 50
    out_label = 'query_seq'


[[step]]
  action = 'ExtractRegex'
  source = 'name:read1'
  query = '\d+'
  out_label ='number_from_name'


[[step]]
    action = 'HammingCorrect'
    output = 'label'
    on_tie = 'fail'
    on_no_match = 'remove'
    in_label = 'query_seq'
    out_label = 'ref_name'
    barcodes = 'ref_barcodes'
    max_hamming_distance = 0

[barcodes.ref_barcodes]
    from_file.filename = 'input_reference.fa'

[[step]]
  action = 'CalcBaseContent'
  out_label = 'acontent'
  bases_to_count = 'A'
  relative = true

[[step]]
  action = 'EvalExpression'
  query = 'acontent > 0.25'
  out_label='many_a'
  result_type='bool'

[output.bam]
    [output.bam.tag_to_bam_tag]
        barcode = 'BC'
        acontent = 'XC'
        many_a = 'XB'
        number_from_name = 'RR'
        

    [output.bam.tag_to_reference]
        tag = 'ref_name'
        references_from_barcodes = 'ref_barcodes'


[[step]]
  action = 'StoreTagsInTable'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputBAM"
    bam = { tag_to_bam_tag = { barcode = "BC", acontent = "XC", many_a = "XB", number_from_name = "RR" }, tag_to_reference = { tag = "ref_name", references_from_barcodes = "ref_barcodes" } }
