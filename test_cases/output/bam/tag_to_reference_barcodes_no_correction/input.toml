[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    source = 'read1'
    anchor = 'start'
    start = 0
    length = 50
    out_label = 'query_seq'

[barcodes.ref_barcodes]
    from_file.filename = 'input_reference.fa'

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputBAM"
    tag_to_reference = { tag = "query_seq", references_from_barcodes = "ref_barcodes" }
