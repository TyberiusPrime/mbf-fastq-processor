[input]
    read1 = 'input_read1.fq'

# Extract first 2 bases as sample barcode
[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    source = "read1"
    start = 0
    len = 2
    out_label = 'sample'

# Extract next 2 bases as lane barcode
[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    source = "read1"
    start = 2
    len = 2
    out_label = 'lane'

[[step]]
  action ="HammingCorrect"
    output = 'label'
    on_tie = 'fail'
    on_no_match = 'remove'
  barcodes = "lanes"
  in_label="lane"
  out_label="ref_lane"
  max_hamming_distance = 0

[[step]]
  action= 'EvaluateExpression'
  expr = 'read_no % 2 != 0'
  out_label = 'even'
  result_type = 'bool'

[[step]]
    action = 'Demultiplex'
    in_label = 'sample'
    output_unmatched = true
    barcodes = 'samples'


[[step]]
    action = 'Demultiplex'
    in_label = 'even'

[[step]]
    action = 'Demultiplex'
    in_label = 'ref_lane'
    output_unmatched = true
    barcodes = 'lanes'


[barcodes.samples]
    AA = 'sampleA'
    GG = 'sampleB'

[barcodes.lanes]
    CG = 'lane1'
    TC = 'lane2'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputBAM"
    bam = { tag_to_reference = { tag = "ref_lane", from_barcodes = "lanes" }, merge_demultiplexed = true, index_merged = false }
