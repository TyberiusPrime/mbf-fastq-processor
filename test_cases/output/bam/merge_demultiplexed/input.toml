[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    source = "read1"
    start = 0
    len = 2
    out_label = 'barcode'

[[step]]
    action = 'Demultiplex'
    in_label = 'barcode'
    output_unmatched = true
    barcodes = 'barcodes'

[barcodes.barcodes]
    AA = 'sample1'
    GG = 'sample2'

[output]
    prefix = 'output'
    format = 'bam'

    [output.bam]
        merge_demultiplexed = 'barcode'
