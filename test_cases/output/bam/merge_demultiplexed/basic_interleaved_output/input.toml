  options.accept_duplicate_files = true
[input]
    read1 = 'input_read1.fq'
    read2 = 'input_read1.fq'
    read3 = 'input_read1.fq'
    read4 = 'input_read1.fq'

[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    source = "read1"
    start = 0
    len = 2
    out_label = 'barcode'

[[step]]
    action ='ReverseComplement'
    target = 'read2'

[[step]]
  action = "HammingCorrect"
      output = 'label'
      on_tie = 'fail'
      on_no_match = 'remove'
  barcodes = 'barcodes'
  in_label='barcode'
  out_label='refs'
  max_hamming_distance =0

[[step]]
    action = 'Demultiplex'
    in_label = 'refs'
    output_unmatched = true
    barcodes = 'barcodes'

[barcodes.barcodes]
    AA = 'sample1'
    GG = 'sample2'

[output]
    prefix = 'output'
    interleave = ['read1','read2','read3','read4']
    format = 'bam'

    [output.bam]
        tag_to_reference.references_from_barcodes = "barcodes"
        tag_to_reference.tag="refs"
        merge_demultiplexed = true
