[input]
    read1 = 'input_read1.fq'

# Extract first 2 bases as sample barcode
[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    source = "read1"
    start = 0
    len = 2
    out_label = 'sample'

# Extract next 2 bases as lane barcode
[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    source = "read1"
    start = 2
    len = 2
    out_label = 'lane'

[[step]]
  action ="AssignToReference"
  barcodes = "lanes"
  in_label="lane"
  out_label="ref_lane"
  max_hamming_distance = 0
  

[[step]]
    action = 'Demultiplex'
    in_label = 'ref_lane'
    output_unmatched = true
    barcodes = 'lanes'

[[step]]
    action = 'Demultiplex'
    in_label = 'sample'
    output_unmatched = true
    barcodes = 'samples'


[barcodes.samples]
    AA = 'sampleA'
    GG = 'sampleB'

[barcodes.lanes]
    CG = 'lane1'
    TC = 'lane2'

[output]
    prefix = 'output'
    format = 'bam'

    [output.bam]
        tag_to_reference = {'tag'= 'ref_lane', from_barcodes = "lanes"}
        merge_demultiplexed = true
