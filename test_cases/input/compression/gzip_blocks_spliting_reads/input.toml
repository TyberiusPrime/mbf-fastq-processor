[input]
    read1 = 'input_read1.fq.gz'

[options]
    buffer_size = 100

[[step]]
    action = 'Report'
    name = 'report'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "Gzip"

[[step]]
    action = "OutputReport"
    json = true
    html = false
