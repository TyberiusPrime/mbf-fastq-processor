[input]
read1 = "input_read1.fq"

[output]
    prefix = "output"
[[step]]
action = "ExtractRegex"
out_label = "has_adapter"
pattern = "with_adapter"
segment = "name:read1"

# Conditionally cut start only for reads with adapter
[[step]]
action = "CutStart"
n = 5
segment = "read1"
if_tag = "has_adapter"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
