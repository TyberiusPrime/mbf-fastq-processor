[input]
read1 = ["input_read1.fq"]

[output]
    prefix = "output"
[[step]]
action = "ExtractRegex"
out_label = "has_atgc"
search = "ATGC"
segment = "read1"

# Conditionally cut start only for reads with the pattern
# This tests that location tags can be used as boolean conditions
[[step]]
action = "CutStart"
n = 3
segment = "read1"
if_tag = "has_atgc"



# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
