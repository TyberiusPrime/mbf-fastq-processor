[input]
    read1 = 'input_read1.fq.gz'

[output]
    prefix = 'output'
    report_json=true

[[step]]
    action = 'Report'
    name = 'start'


[[step]]
    action = 'Head'
    n = 100

[[step]]
    action = 'Report'
    name = 'pre_multiplex'

[[step]]
    action = 'ExtractRegex'
    source = "name:read1"
    query = "\\d(..) "
    replacement = "$1"
    out_label = 'demult'


[[step]]
  action = 'StoreTagsInTable'

[[step]]
    action = 'Demultiplex'
    in_label = 'demult'
    output_unmatched = true
	barcodes = 'demultiplex'

[barcodes.demultiplex]
    CT = 'aaaa'
    GG = 'gggg'

[[step]]
    action = 'Head'
    n = 10

[[step]]
    action = 'Report' # max 10 output reads
    name = 'post_multiplex'
