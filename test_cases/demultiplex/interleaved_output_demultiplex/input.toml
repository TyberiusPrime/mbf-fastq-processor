[input]
    read1 = 'input_read1.fq.zst'
    read2 = 'input_read2.fq.zst'

    index1 = 'input_index1.fq.zst'
    index2 = 'input_index2.fq.zst'

[[step]]
    action = 'Truncate'
    segment = 'index1'
    n = 3

[[step]]
    action = 'Truncate'
    segment = 'index2'
    n = 3
[[step]]
    action='ExtractRegion'
    anchor = "Start"
    segment = 'read1'
    start = 0
    length = 1
    out_label = 'x'


[[step]]
  action = "EvalExpression"
  out_label = "ee"
  expression = "len_read1"
   


[[step]]
    action = 'Demultiplex'
    in_label = 'x'
	barcodes = 'd'
    output_unmatched = true

[barcodes.d]
    C = 'rc'
    A = 'ra'
    G = 'rg'

[options]
    output_buffer_size = 10000
    accept_duplicate_files = true

[[step]]
    action = 'Progress'
    output_infix = 'pp'
 
[[step]]
  action = "ForgetTag"
  in_label = "ee"
  
[output]
    prefix = "output"

[[step]]
    action = "OutputFASTQ"
    output = ["index1", "index2"]
    interleave = ["read1", "read2"]
    compression = "Zst"
    output_hash_uncompressed = true
