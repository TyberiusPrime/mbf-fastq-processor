[input]
    read1 = 'input_read1.fq'

[output]
    prefix = "output"
[[step]]
    action = 'ExtractRegion'
    anchor = "Start"
    source = 'read1'
    start = 0
    length = 512
    out_label = 'a12'

[[step]]
  action = 'HammingCorrect'
  in_label = 'a12'
  out_label = 'c12'
  barcodes = 'bc46'
  max_hamming_distance=1
  on_no_match='keep'
    on_tie = 'fail'

[[step]]
    action = 'Demultiplex'
    in_label = 'c12'
	barcodes='bc46'
    output_unmatched = true



[barcodes.bc46]
# one off from th actual sequence
     = 'ag'



# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
