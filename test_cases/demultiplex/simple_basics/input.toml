[input]
    read1 = 'input_read1.fq.gz'

[output]
    prefix = 'output'
    report_json=true
    report_html=true

[[step]]
    action = 'Report'
    name = 'start'


[[step]]
    action = 'Head'
    n = 100


[[step]]
    action = 'ExtractRegion'
    anchor = "Left"
    source = "read1"
    start = 0
    len = 2
    out_label = 'demult'

[[step]]
    action = 'Report'
    name = 'pre_multiplex'
    count = true # count reads at this position
    base_statistics = true # include base distribution at each read position, q20, q30, total, gc bases
    length_distribution = true # capture read length distribution
    duplicate_count_per_read = true # count duplicates using Cukoo filter on each read1/read2/index1/index2
    duplicate_count_per_fragment = true # count duplicates using Cukoo filter, on concatenated read1/read2/index1/index2
    count_oligos = ['ctcc','AAAA'] # if set, count these oligos in the segment. Full match only, no iupac
    count_oligos_segment = "all" # segment to count oligos in, can be 'all', 'read1', ...
    tag_histograms = ["demult"] # Calculate a histo

[[step]]
    action = 'Demultiplex'
    in_label = 'demult'
    output_unmatched = true
	barcodes = 'demultiplex'

[barcodes.demultiplex]
    CT = 'aaaa'
    TT = 'gggg'

# [[step]]
#     action = 'Head'
#     n = 10

[[step]]
    action = 'Report' # max 10 output reads
    name = 'post_multiplex'
    count = true # count reads at this position
    base_statistics = true # include base distribution at each read position, q20, q30, total, gc bases
    length_distribution = true # capture read length distribution
    duplicate_count_per_read = true # count duplicates using Cukoo filter on each read1/read2/index1/index2
    duplicate_count_per_fragment = true # count duplicates using Cukoo filter, on concatenated read1/read2/index1/index2
    count_oligos = ['ctcc','AAAA'] # if set, count these oligos in the segment. Full match only, no iupac
    count_oligos_segment = "all" # segment to count oligos in, can be 'all', 'read1', ...
    tag_histograms = ["demult"] # Calculate a histo

