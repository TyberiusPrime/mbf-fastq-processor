[workspace]
	members = ["fastqrab", "fastqrab-dna", "fastqrab-config", "fastqrab-io", "fastqrab-steps"]
    resolver = "2"

[workspace.lints.clippy]
  unwrap_used = "deny"

[workspace.package]
	edition = "2024"
	version = "0.8.1"
	rust-version = "1.93.1"
	authors = ["Florian Finkernagel <finkernagel@imt.uni-marburg.de>"]
	license = "MIT"
	repository = "https://github.com/TyberiusPrime/fastqrab"
	homepage = "https://tyberiusprime.github.io/fastqrab/"
	readme = "README.md"
	description = "The fast, reliable multitool of FASTQ processing"
	keywords = ["bioinformatics", "fastq", "sequencing"]
	categories = ["command-line-utilities", "science::bioinformatics::genomics", "science::bioinformatics"]
	exclude = [
	"AGENTS.md",
	"bacon.toml",
    "benchmarks/",
	".claude/",
	"CLAUDE.md",
    "cookbooks/*/input/",
    "cookbooks/*/reference_output/",
	"dev/",
	"docs/",
	"experiments/",
	".github/",
	"test_cases/",
]

[workspace.dependencies]
	allocation-counter = "0.8.1"
	anyhow = { version = "1.0.89", default-features = false }
	bio = "3.0"
	bstr = { version = "1.12.0", default-features = false, features=["alloc"] }
    bytes= { version = "1.11.1" }  # https://github.com/advisories/GHSA-434x-w66g-qw3r
	clap_complete = "4.5"
	clap = { version = "4.5", default-features = false, features = ["error-context", "help", "std", "usage", "suggestions"] }
	crossbeam = "0.8.4"
	csv = "1.3.1"
	enum_dispatch = "0.3.13"
	ex = "0.1.3"
	fasteval = "0.2"
	flate2 = { version = "1", default-features = false }
	gzp = { version = "2.0", default-features = false, features = ["deflate_zlib"] }
	human-panic = { version = "2.0.2", default-features = false }
	indexmap = { version = "2.9.0", default-features = false, features=["serde"]}
	json_value_merge = "2.0.1"
	log = "0.4.28"
	memchr = { version = "2.7.4", default-features = false }
    mutants = "0.0.3"
	niffler = "3.0"
	noodles = { version = "0.108.0", features = ["bam", "bgzf", "csi", "sam"] }
	num_cpus = "1.16"
	rand_chacha = { version = "0.9", default-features = false }
	rand = { version = "0.9.4", default-features = false }
	regex = "1.11.1"
    scalable_cuckoo_filter = "0.5.1"
	schemars = { version = "1.1.0", features = ["preserve_order", "schemars_derive"], default-features = false }
	serde_json = "1.0.132"
	serde = { version = "1.0.228", default-features = false }
	sha2 = { version = "0.10.8", default-features = false }
	tempfile = { version = "3.13.0", default-features = false }
	toml_edit = "0.24"
	toml-pretty-deser = {version="0.3.3"}
	toml = { version = "0.9.5", features = ["parse"], default-features = false }
    triple_accel = "0.4.0"
    typed_floats = "1.0.7"
	zstd = { version = "0.13.2", default-features = false }

    fastqrab-config= {path="fastqrab-config"}
    fastqrab-dna = {path="fastqrab-dna"}
    fastqrab-io = {path="fastqrab-io"}
    fastqrab-steps = {path="fastqrab-steps"}



[profile.release]
	debug = 1


# reduce to minimal necessary debug information in dev profile.
# use debugging profile for full.
[profile.dev]
debug = "line-tables-only"

[profile.debugging]
inherits = "dev"
debug = true


[profile.dev.package."*"]
     debug = false
	opt-level = 3

[profile.dev.package.toml-pretty-deser]
opt-level = 3
debug = false

[profile.dev.package.toml-pretty-deser-macros]
opt-level = 3
debug = false

[profile.dev.package.schemars]
opt-level = 3
debug = false

[profile.dev.package.schemars_derive]
opt-level = 3
debug = false

[profile.dev.build-override]
opt-level = 3


[profile.mutants]
inherits = "test"
debug = "none"

